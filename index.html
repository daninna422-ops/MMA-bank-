<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>MMA Bank</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

html,body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body{
  background:#f4f7fe;
  color:#202b55;
}

/* =========================
   MAIN APP
========================= */

.app{
  width:100%;
  min-height:100vh;
}

/* =========================
   WELCOME
========================= */

.screen{
  width:100%;
  min-height:100vh;
  display:none;
  padding:25px 20px;
}

.screen.active{
  display:flex;
}

#welcomeScreen{
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(
    145deg,
    #0066ff,
    #0044b3
  );
  color:white;
}

.logo-circle{
  width:100px;
  height:100px;
  border-radius:30px;
  background:white;
  color:#0066ff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:35px;
  font-weight:bold;

  box-shadow:0 15px 35px rgba(0,0,0,.2);
  margin-bottom:25px;
}

#welcomeScreen h1{
  font-size:32px;
  margin-bottom:10px;
}

#welcomeScreen p{
  font-size:15px;
  opacity:.85;
  line-height:1.5;
  margin-bottom:35px;
}

/* =========================
   BUTTONS
========================= */

.btn{
  width:100%;
  max-width:400px;

  height:54px;

  border:none;
  border-radius:15px;

  font-size:16px;
  font-weight:bold;

  cursor:pointer;
  margin-top:12px;
}

.btn-primary{
  background:#0066ff;
  color:white;
}

.btn-white{
  background:white;
  color:#0066ff;
}

.btn-outline{
  background:transparent;
  color:#0066ff;
  border:2px solid #0066ff;
}

/* =========================
   AUTH SCREEN
========================= */

#authScreen{
  flex-direction:column;
  justify-content:flex-start;
  background:#f4f7fe;
}

.auth-header{
  text-align:center;
  margin:15px 0 25px;
}

.auth-logo{
  width:65px;
  height:65px;
  border-radius:20px;

  background:#0066ff;
  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:0 auto 12px;

  font-size:22px;
  font-weight:bold;
}

.auth-header h2{
  font-size:25px;
}

.auth-header p{
  color:#8993ad;
  margin-top:6px;
}

/* =========================
   TABS
========================= */

.tabs{
  width:100%;
  max-width:500px;

  display:grid;
  grid-template-columns:1fr 1fr;

  background:#e5ebf7;
  border-radius:14px;

  padding:4px;
  margin:0 auto 20px;
}

.tab{
  border:none;
  background:transparent;

  padding:13px;

  border-radius:11px;

  font-weight:bold;
  color:#8993ad;

  cursor:pointer;
}

.tab.active{
  background:white;
  color:#0066ff;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

/* =========================
   FORM
========================= */

.form{
  width:100%;
  max-width:500px;
  margin:auto;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;

  font-size:14px;
  font-weight:bold;

  margin-bottom:7px;
  color:#203b72;
}

.input{
  width:100%;
  height:52px;

  border:2px solid #dce3f0;
  border-radius:14px;

  padding:0 15px;

  background:white;

  font-size:16px;
  color:#202b55;

  outline:none;
}

.input:focus{
  border-color:#0066ff;
}

/* =========================
   PHONE
========================= */

.phone-row{
  display:flex;
  gap:8px;
}

.country{
  width:105px;
  height:52px;

  border:2px solid #dce3f0;
  border-radius:14px;

  background:white;

  padding:0 8px;

  font-size:15px;
  outline:none;
}

.phone-input{
  flex:1;
}

/* =========================
   PIN
========================= */

.pin-input{
  letter-spacing:8px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

/* =========================
   FORGOT
========================= */

.forgot{
  text-align:right;
  margin:4px 0 15px;
}

.forgot button{
  border:none;
  background:none;

  color:#0066ff;
  font-weight:bold;

  cursor:pointer;
}

/* =========================
   REGISTER
========================= */

#registerForm{
  display:none;
}

#loginForm{
  display:block;
}

.small-note{
  text-align:center;

  font-size:12px;
  color:#8993ad;

  margin-top:15px;
  line-height:1.5;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:380px){

  .screen{
    padding:20px 15px;
  }

  #welcomeScreen h1{
    font-size:28px;
  }

  .input,
  .country{
    height:50px;
  }

  .btn{
    height:52px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- ==================================================
     WELCOME SCREEN
================================================== -->

<section id="welcomeScreen" class="screen active">

  <div class="logo-circle">
    MMA
  </div>

  <h1>MMA BANK</h1>

  <p>
    Barka da zuwa MMA Bank.<br>
    Bankin ku na zamani.
  </p>

  <button
    class="btn btn-white"
    onclick="showAuth('login')">
    LOGIN
  </button>

  <button
    class="btn btn-outline"
    style="color:white;border-color:white;"
    onclick="showAuth('register')">
    REGISTER
  </button>

</section>


<!-- ==================================================
     AUTH SCREEN
================================================== -->

<section id="authScreen" class="screen">

  <div class="auth-header">

    <div class="auth-logo">
      MMA
    </div>

    <h2 id="authTitle">
      Welcome Back
    </h2>

    <p id="authSubtitle">
      Shiga MMA Bank account ɗinka
    </p>

  </div>


  <!-- TABS -->

  <div class="tabs">

    <button
      id="loginTab"
      class="tab active"
      onclick="switchTab('login')">
      LOGIN
    </button>

    <button
      id="registerTab"
      class="tab"
      onclick="switchTab('register')">
      REGISTER
    </button>

  </div>


  <!-- ==================================================
       LOGIN FORM
  ================================================== -->

  <form
    id="loginForm"
    class="form"
    onsubmit="loginDemo(event)">

    <div class="form-group">

      <label>
        Phone Number
      </label>

      <div class="phone-row">

        <select class="country">
          <option value="+234">
            🇳🇬 +234
          </option>

          <option value="+233">
            🇬🇭 +233
          </option>

          <option value="+254">
            🇰🇪 +254
          </option>

          <option value="+27">
            🇿🇦 +27
          </option>

          <option value="+1">
            🇺🇸 +1
          </option>

          <option value="+44">
            🇬🇧 +44
          </option>
        </select>

        <input
          id="loginPhone"
          class="input phone-input"
          type="tel"
          placeholder="8012345678"
          maxlength="15"
          required>

      </div>

    </div>


    <div class="form-group">

      <label>
        PIN 6
      </label>

      <input
        id="loginPin"
        class="input pin-input"
        type="password"
        inputmode="numeric"
        maxlength="6"
        placeholder="••••••"
        required>

    </div>


    <div class="forgot">

      <button
        type="button"
        onclick="forgotPassword()">
        Forgot Password?
      </button>

    </div>


    <button
      class="btn btn-primary"
      type="submit">
      LOGIN
    </button>

    <p class="small-note">
      window.location.href = "dashboard.html";
    </p>

  </form>


  <!-- ==================================================
       REGISTER FORM
  ================================================== -->

  <form
    id="registerForm"
    class="form"
    onsubmit="registerDemo(event)">

    <div class="form-group">

      <label>
        First Name
      </label>

      <input
        id="firstName"
        class="input"
        type="text"
        placeholder="Saka suna"
        required>

    </div>


    <div class="form-group">

      <label>
        Last Name
      </label>

      <input
        id="lastName"
        class="input"
        type="text"
        placeholder="Saka sunan mahaifi"
        required>

    </div>


    <div class="form-group">

      <label>
        Country & Phone Number
      </label>

      <div class="phone-row">

        <select
          id="registerCountry"
          class="country">

          <option value="+234">
            🇳🇬 +234
          </option>

          <option value="+233">
            🇬🇭 +233
          </option>

          <option value="+254">
            🇰🇪 +254
          </option>

          <option value="+27">
            🇿🇦 +27
          </option>

          <option value="+1">
            🇺🇸 +1
          </option>

          <option value="+44">
            🇬🇧 +44
          </option>

        </select>

        <input
          id="registerPhone"
          class="input phone-input"
          type="tel"
          inputmode="numeric"
          placeholder="8012345678"
          maxlength="15"
          required>

      </div>

    </div>


    <div class="form-group">

      <label>
        Create PIN 6
      </label>

      <input
        id="registerPin"
        class="input pin-input"
        type="password"
        inputmode="numeric"
        maxlength="6"
        placeholder="••••••"
        required>

    </div>


    <div class="form-group">

      <label>
        Confirm PIN 6
      </label>

      <input
        id="confirmPin"
        class="input pin-input"
        type="password"
        inputmode="numeric"
        maxlength="6"
        placeholder="••••••"
        required>

    </div>


    <button
      class="btn btn-primary"
      type="submit">
      REGISTER
    </button>

    <p class="small-note">
      Ta hanyar Register, zaka ci gaba zuwa
      OTP verification.
    </p>

  </form>

</section>

</div>


<script>

/* ==================================================
   SCREEN CONTROL
================================================== */

function showAuth(type){

  document
    .getElementById("welcomeScreen")
    .classList.remove("active");

  document
    .getElementById("authScreen")
    .classList.add("active");

  switchTab(type);
}


/* ==================================================
   SWITCH LOGIN / REGISTER
================================================== */

function switchTab(type){

  const loginForm =
    document.getElementById("loginForm");

  const registerForm =
    document.getElementById("registerForm");

  const loginTab =
    document.getElementById("loginTab");

  const registerTab =
    document.getElementById("registerTab");

  const title =
    document.getElementById("authTitle");

  const subtitle =
    document.getElementById("authSubtitle");


  if(type === "login"){

    loginForm.style.display = "block";
    registerForm.style.display = "none";

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

    title.innerText =
      "Welcome Back";

    subtitle.innerText =
      "Shiga MMA Bank account ɗinka";

  }else{

    loginForm.style.display = "none";
    registerForm.style.display = "block";

    loginTab.classList.remove("active");
    registerTab.classList.add("active");

    title.innerText =
      "Create Account";

    subtitle.innerText =
      "Ƙirƙiri sabon MMA Bank account";

  }

}


/* ==================================================
   REGISTER DEMO
================================================== */

function registerDemo(event){

  event.preventDefault();

  const firstName =
    document.getElementById("firstName").value.trim();

  const lastName =
    document.getElementById("lastName").value.trim();

  const country =
    document.getElementById("registerCountry").value;

  const phone =
    document.getElementById("registerPhone").value.trim();

  const pin =
    document.getElementById("registerPin").value;

  const confirmPin =
    document.getElementById("confirmPin").value;


  /* PIN MUST BE 6 DIGITS */

  if(!/^\d{6}$/.test(pin)){

    alert(
      "PIN dole ne ya zama lambobi 6."
    );

    return;
  }


  if(pin !== confirmPin){

    alert(
      "PIN biyu ba su yi daidai ba."
    );

    return;
  }


  if(phone.length < 7){

    alert(
      "Saka lambar waya daidai."
    );

    return;
  }


  alert(
    "An karɓi bayanan registration.\n\n" +
    "Suna: " + firstName + " " + lastName + "\n" +
    "Phone: " + country + phone +
    "\n\n" +
    "Mataki na gaba: OTP verification."
  );

}


/* ==================================================
   LOGIN DEMO
================================================== */

function loginDemo(event){

  event.preventDefault();

  const phone =
    document.getElementById("loginPhone").value.trim();

  const pin =
    document.getElementById("loginPin").value;


  if(!/^\d{6}$/.test(pin)){

    alert(
      "PIN dole ne ya zama lambobi 6."
    );

    return;
  }


  if(phone.length < 7){

    alert(
      "Saka lambar waya daidai."
    );

    return;
  }


  alert(
    "Login demo ne yanzu.\n\n" +
    "Mataki na gaba za mu haɗa OTP " +
    "da dashboard."
  );window.location.href = "dashboard.html";

}


/* ==================================================
   FORGOT PASSWORD
================================================== */

function forgotPassword(){

  alert(
    "Forgot Password\n\n" +
    "A mataki na gaba za mu saka:\n" +
    "1. Phone Number\n" +
    "2. OTP\n" +
    "3. Sabon PIN"
  );

}


/* ==================================================
   ONLY ALLOW NUMBERS IN PIN
================================================== */

document
  .querySelectorAll(".pin-input")
  .forEach(function(input){

    input.addEventListener(
      "input",
      function(){

        this.value =
          this.value.replace(/\D/g,"");

      }
    );

  });

</script>

</body>
</html>
